<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Cachorros</title>
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }

    body {
        background-color: beige;
        text-align: center;
        font-size: 30px;
    
    }

    h1 {
        font-family:cursive;
        font-size: 50px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        color:rgb(92, 62, 1)
       }

       p {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 20px;
       }

       h2 {
        font-family: Arial, sans-serif;
        font-size: 20px;
        color:rgb(60, 49, 38)
       }

       #aleatorios {
  background-color: #905906;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
       }

       #porRaca {
        background-color: #905906;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
       }
     .conteudo {
  background-color: #dec885;      
  border: 1px solid #3f2e04;     
  border-radius: 0px;            
  padding: 25px;                  
  max-width: auto;             
  font-family: Arial, sans-serif;
     }

     label {
        font-family:'Courier New', Courier, monospace;
     }

     #galeria {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        padding: 50px;
        
    
     }

     #galeria img {
         width: 250px;
        height: 200px;
        object-fit: cover;
         border: 5px solid #3f2e04;
        border-radius: 15px;
    padding: 3px;
        
     }
    
</style>
<body>
<div class ="conteudo">
    <h1>Galeria de Cachorros</h1>
    <br>
    <h2>Pensa em adotar algum animalzinho? Tenha alguma ideia em mente</h2>
    <br>
    <p>Aqui nós fornecemos imagens de diversas raças do pet mais companheiro do mundo.</p>
</div>
    <label for="racas">Escolha uma raça:</label>
        <select id="racas">
        <option value="">Selecione uma raça</option>
        </select>
   

    <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" min="1" max="10" value="3">

    <button id="aleatorios">Mostrar aleatorios</button>
    <button id="porRaca">Mostrar 3 da raça</button>

    <p id="mensagem"></p>

    <div id="galeria"></div>

    <script src="script.js"></script>
</body>

</html>
